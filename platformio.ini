[platformio]
src_dir = .
include_dir = Inc

[env:nucleo_f767zi]
platform = ststm32
board = nucleo_f767zi
framework = stm32cube

upload_protocol = cmsis-dap
debug_tool = stlink

monitor_speed = 115200

build_flags =
    -DSTM32F767xx
    -DUSE_HAL_DRIVER
    -I Inc
    -I Drivers/CMSIS/Include
    -I Drivers/CMSIS/Device/ST/STM32F7xx/Include
    -I Drivers/STM32F7xx_HAL_Driver/Inc
    -I Middlewares/Third_Party/LwIP/src/include
    -I Middlewares/Third_Party/LwIP/system

build_src_filter =
    +<Src/*.c>
    +<Middlewares/Third_Party/LwIP/src/core/*.c>
    +<Middlewares/Third_Party/LwIP/src/core/ipv4/*.c>
    +<Middlewares/Third_Party/LwIP/src/netif/*.c>
    +<Middlewares/Third_Party/LwIP/src/api/*.c>



